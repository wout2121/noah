name: Fork Signet APK

# Debug-signed Signet APK build on GitHub-hosted runners,
# for testing a branch on a fork without self-hosted runners or signing secrets.
# The APK is only stored as a workflow artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/recurring-payments
    paths:
      - .github/workflows/fork-signet-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Signet APK (debug-signed)
        env:
          CI_DEBUG_SIGNING: "true"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun client build:android:signet:ci:apk

      - name: Rename APK
        id: apk
        run: |
          out="noah-signet-$(git rev-parse --short HEAD).apk"
          mv client/android/app/build/outputs/apk/signet/release/app-signet-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noah-signet-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
